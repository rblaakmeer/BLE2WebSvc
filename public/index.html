<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLE2WebSvc - Device Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.8rem;
            font-weight: 500;
        }

        .refresh-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            margin-bottom: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .device-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .device-card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            background: #fafafa;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .device-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .device-name {
            font-size: 1.3rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .device-info {
            color: #666;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .device-info strong {
            color: #333;
        }

        .connect-btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .connect-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(79, 172, 254, 0.4);
        }

        .connect-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .services-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .service-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .service-uuid {
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 10px;
        }

        .characteristics-list {
            margin-top: 10px;
        }

        .characteristic-item {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .characteristic-info {
            width: 100%;
            overflow-wrap: break-word;
        }

        .characteristic-uuid {
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            color: #666;
            word-break: break-all;
            line-height: 1.3;
        }

        .read-btn {
            background: linear-gradient(135deg, #56ab2f 0%, #a8e6cf 100%);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: transform 0.2s;
            margin-right: 5px;
        }

        .read-btn:hover {
            transform: translateY(-1px);
        }

        .write-btn {
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: transform 0.2s;
        }

        .write-btn:hover {
            transform: translateY(-1px);
        }

        .subscribe-btn {
            background: linear-gradient(135deg, #8e44ad 0%, #9b59b6 100%);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: transform 0.2s;
        }

        .subscribe-btn:hover {
            transform: translateY(-1px);
        }

        .subscribe-btn.subscribed {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
        }

        .notifications-section {
            margin-top: 8px;
            padding: 10px;
            background: #f8f4ff;
            border-radius: 4px;
            border: 1px solid #8e44ad;
            max-height: 200px;
            overflow-y: auto;
        }

        .notification-item {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 8px;
            margin-bottom: 5px;
            font-size: 0.8rem;
        }

        .notification-value {
            font-family: 'Courier New', monospace;
            background: #f0f0f0;
            padding: 4px;
            border-radius: 2px;
            margin: 4px 0;
            word-break: break-all;
        }

        .notification-time {
            color: #666;
            font-size: 0.7rem;
        }

        .write-input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            margin-top: 8px;
        }

        .write-section {
            margin-top: 8px;
            padding: 10px;
            background: #fff3e0;
            border-radius: 4px;
            border: 1px solid #ffcc02;
        }

        .button-group {
            display: flex;
            flex-direction: row;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: flex-start;
            padding-top: 8px;
            border-top: 1px solid #e0e0e0;
        }

        .characteristic-value {
            margin-top: 8px;
            padding: 8px;
            background: #e8f5e8;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            word-break: break-all;
        }

        .loading {
            text-align: center;
            color: #666;
            font-style: italic;
            padding: 20px;
        }

        .error {
            color: #d32f2f;
            background: #ffebee;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
        }

        .success {
            color: #2e7d32;
            background: #e8f5e8;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-connected {
            background: #4caf50;
        }

        .status-disconnected {
            background: #f44336;
        }

        .status-connecting {
            background: #ff9800;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>BLE2WebSvc</h1>
            <p>Bluetooth Low Energy Device Manager</p>
        </div>
        
        <div class="content">
            <div class="section">
                <h2>Discovered Devices</h2>
                <button class="refresh-btn" id="refresh-btn">Refresh Devices</button>
                <label style="margin-left: 12px; font-size: 0.95rem; color: #333;">
                    <input type="checkbox" id="toggle-unknown" style="margin-right: 6px;">
                    Show unknown devices
                </label>
                <div id="devices-container">
                    <div class="loading">Loading devices...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let devices = [];
        let connectedDevices = new Set();
        let showUnknownDevices = false;
        const activeSubscriptions = new Map();
        const pollingIntervals = new Map();

        document.addEventListener('DOMContentLoaded', function() {
            try {
                const saved = localStorage.getItem('showUnknownDevices');
                showUnknownDevices = saved ? JSON.parse(saved) : false;
            } catch (e) {
                showUnknownDevices = false;
            }

            const refreshButton = document.getElementById('refresh-btn');
            if (refreshButton) {
                refreshButton.addEventListener('click', refreshDevices);
            }

            const toggle = document.getElementById('toggle-unknown');
            if (toggle) {
                toggle.checked = showUnknownDevices;
                toggle.addEventListener('change', (e) => {
                    showUnknownDevices = !!e.target.checked;
                    try { localStorage.setItem('showUnknownDevices', JSON.stringify(showUnknownDevices)); } catch (e) {}
                    displayDevices();
                });
            }

            refreshDevices();
        });

        function text(value, fallback = '') {
            return value === undefined || value === null || value === '' ? fallback : String(value);
        }

        function generatedId(prefix, ...parts) {
            return `${prefix}-${parts.map(part => encodeURIComponent(String(part))).join('-')}`;
        }

        function apiPart(value) {
            return encodeURIComponent(String(value));
        }

        function setMessage(container, className, message) {
            container.replaceChildren();
            const node = document.createElement('div');
            node.className = className;
            node.textContent = message;
            container.appendChild(node);
        }

        function appendText(parent, value) {
            parent.appendChild(document.createTextNode(value));
        }

        function appendLabeledLine(parent, label, value) {
            const strong = document.createElement('strong');
            strong.textContent = label;
            parent.appendChild(strong);
            appendText(parent, ` ${value}`);
            parent.appendChild(document.createElement('br'));
        }

        function getDeviceCard(deviceId) {
            return document.getElementById(generatedId('device', deviceId));
        }

        function getServicesSection(deviceId) {
            return document.getElementById(generatedId('services', deviceId));
        }

        function getValueContainer(deviceId, characteristicUuid) {
            return document.getElementById(generatedId('value', deviceId, characteristicUuid));
        }

        function getWriteSection(deviceId, characteristicUuid) {
            return document.getElementById(generatedId('write', deviceId, characteristicUuid));
        }

        function getWriteInput(deviceId, characteristicUuid) {
            return document.getElementById(generatedId('write-input', deviceId, characteristicUuid));
        }

        function errorFromResponse(response, errorData) {
            return errorData && (errorData.error || errorData.details) ? (errorData.error || errorData.details) : `HTTP error! status: ${response.status}`;
        }

        async function parseErrorResponse(response) {
            try {
                return await response.json();
            } catch (e) {
                return {};
            }
        }

        async function refreshDevices() {
            const container = document.getElementById('devices-container');
            setMessage(container, 'loading', 'Loading devices...');

            try {
                const response = await fetch('/ble/devices');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                devices = await response.json();
                displayDevices();
            } catch (error) {
                console.error('Error fetching devices:', error);
                setMessage(container, 'error', `Failed to load devices: ${error.message}`);
            }
        }

        function displayDevices() {
            const container = document.getElementById('devices-container');
            const list = showUnknownDevices ? devices : devices.filter(device => device.name && device.name.trim() !== '');

            if (list.length === 0) {
                if (devices.length === 0) {
                    setMessage(container, 'loading', 'No devices discovered yet. Make sure Bluetooth is enabled and devices are advertising.');
                } else if (!showUnknownDevices) {
                    setMessage(container, 'loading', 'No named devices found. Toggle "Show unknown devices" to include unnamed devices.');
                } else {
                    setMessage(container, 'loading', 'No devices to display.');
                }
                return;
            }

            const grid = document.createElement('div');
            grid.className = 'device-grid';

            for (const device of list) {
                const deviceId = text(device.id);
                const isConnected = connectedDevices.has(deviceId);
                const card = document.createElement('div');
                card.className = 'device-card';
                card.id = generatedId('device', deviceId);
                card.dataset.deviceId = deviceId;

                const name = document.createElement('div');
                name.className = 'device-name';
                const status = document.createElement('span');
                status.className = `status-indicator ${isConnected ? 'status-connected' : 'status-disconnected'}`;
                name.appendChild(status);
                appendText(name, ` ${text(device.name, 'Unknown Device')}`);

                const info = document.createElement('div');
                info.className = 'device-info';
                appendLabeledLine(info, 'ID:', deviceId);
                appendLabeledLine(info, 'Address:', text(device.address, 'N/A'));
                appendLabeledLine(info, 'RSSI:', `${text(device.rssi, 'N/A')} dBm`);
                appendLabeledLine(info, 'Status:', isConnected ? 'Connected' : 'Disconnected');

                const button = document.createElement('button');
                button.className = 'connect-btn';
                button.textContent = isConnected ? 'Disconnect' : 'Connect';
                button.addEventListener('click', () => toggleConnection(deviceId));

                const services = document.createElement('div');
                services.id = generatedId('services', deviceId);
                services.className = 'services-section';
                services.style.display = isConnected ? 'block' : 'none';

                card.append(name, info, button, services);
                grid.appendChild(card);
            }

            container.replaceChildren(grid);
        }

        async function toggleConnection(deviceId) {
            const card = getDeviceCard(deviceId);
            const button = card.querySelector('.connect-btn');
            const statusIndicator = card.querySelector('.status-indicator');
            const servicesSection = getServicesSection(deviceId);
            const isConnected = connectedDevices.has(deviceId);

            button.disabled = true;
            statusIndicator.className = 'status-indicator status-connecting';
            button.textContent = isConnected ? 'Disconnecting...' : 'Connecting...';

            try {
                if (isConnected) {
                    const response = await fetch(`/ble/devices/${apiPart(deviceId)}/disconnect`, { method: 'POST' });
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    connectedDevices.delete(deviceId);
                    statusIndicator.className = 'status-indicator status-disconnected';
                    button.textContent = 'Connect';
                    servicesSection.style.display = 'none';
                    servicesSection.replaceChildren();
                    cleanupSubscriptionsForDevice(deviceId);
                } else {
                    const response = await fetch(`/ble/devices/${apiPart(deviceId)}/connect`, { method: 'POST' });
                    if (!response.ok) {
                        throw new Error(errorFromResponse(response, await parseErrorResponse(response)));
                    }

                    connectedDevices.add(deviceId);
                    statusIndicator.className = 'status-indicator status-connected';
                    button.textContent = 'Disconnect';
                    await loadServicesAndCharacteristics(deviceId);
                    servicesSection.style.display = 'block';
                }
            } catch (error) {
                console.error('Connection error:', error);
                statusIndicator.className = 'status-indicator status-disconnected';
                button.textContent = 'Connect';

                const errorDiv = document.createElement('div');
                errorDiv.className = 'error';
                errorDiv.textContent = `Connection failed: ${error.message}`;
                card.appendChild(errorDiv);

                setTimeout(() => {
                    if (errorDiv.parentNode) {
                        errorDiv.parentNode.removeChild(errorDiv);
                    }
                }, 5000);
            } finally {
                button.disabled = false;
            }
        }

        async function loadServicesAndCharacteristics(deviceId) {
            const servicesSection = getServicesSection(deviceId);
            setMessage(servicesSection, 'loading', 'Loading services...');

            try {
                const servicesResponse = await fetch(`/ble/devices/${apiPart(deviceId)}/services`);
                if (!servicesResponse.ok) {
                    throw new Error(`HTTP error! status: ${servicesResponse.status}`);
                }

                const services = await servicesResponse.json();
                servicesSection.replaceChildren();

                if (services.length === 0) {
                    setMessage(servicesSection, 'loading', 'No services found.');
                    return;
                }

                const heading = document.createElement('h3');
                heading.textContent = 'Services & Characteristics';
                servicesSection.appendChild(heading);

                for (const service of services) {
                    const serviceUuid = text(service.uuid);
                    const card = document.createElement('div');
                    card.className = 'service-card';
                    appendLabeledLine(card, 'Service:', text(service.name, 'Unknown Service'));

                    const uuid = document.createElement('div');
                    uuid.className = 'service-uuid';
                    uuid.textContent = `UUID: ${serviceUuid}`;
                    card.appendChild(uuid);

                    const characteristics = document.createElement('div');
                    characteristics.id = generatedId('characteristics', deviceId, serviceUuid);
                    characteristics.className = 'characteristics-list';
                    setMessage(characteristics, 'loading', 'Loading characteristics...');
                    card.appendChild(characteristics);
                    servicesSection.appendChild(card);

                    await loadCharacteristics(deviceId, serviceUuid);
                }
            } catch (error) {
                console.error('Error loading services:', error);
                setMessage(servicesSection, 'error', `Failed to load services: ${error.message}`);
            }
        }

        async function loadCharacteristics(deviceId, serviceUuid) {
            const characteristicsContainer = document.getElementById(generatedId('characteristics', deviceId, serviceUuid));

            try {
                const response = await fetch(`/ble/devices/${apiPart(deviceId)}/services/${apiPart(serviceUuid)}/characteristics`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const characteristics = await response.json();
                characteristicsContainer.replaceChildren();

                if (characteristics.length === 0) {
                    setMessage(characteristicsContainer, 'loading', 'No characteristics found.');
                    return;
                }

                for (const char of characteristics) {
                    const characteristicUuid = text(char.uuid);
                    const properties = Array.isArray(char.properties) ? char.properties : [];
                    const canRead = properties.includes('read');
                    const canWrite = properties.includes('write') || properties.includes('writeWithoutResponse');
                    const canNotify = properties.includes('notify') || properties.includes('indicate');

                    const item = document.createElement('div');
                    item.className = 'characteristic-item';

                    const info = document.createElement('div');
                    info.className = 'characteristic-info';
                    const name = document.createElement('strong');
                    name.textContent = text(char.name, 'Unknown Characteristic');
                    info.appendChild(name);
                    info.appendChild(document.createElement('br'));

                    const uuid = document.createElement('div');
                    uuid.className = 'characteristic-uuid';
                    uuid.textContent = `UUID: ${characteristicUuid}`;
                    info.appendChild(uuid);

                    const props = document.createElement('div');
                    props.style.fontSize = '0.8rem';
                    props.style.color = '#888';
                    props.style.marginTop = '4px';
                    props.textContent = `Properties: ${properties.length ? properties.join(', ') : 'N/A'}`;
                    info.appendChild(props);

                    const buttonGroup = document.createElement('div');
                    buttonGroup.className = 'button-group';

                    if (canRead) {
                        const readButton = document.createElement('button');
                        readButton.className = 'read-btn';
                        readButton.textContent = 'Read';
                        readButton.addEventListener('click', () => readCharacteristic(deviceId, characteristicUuid, readButton));
                        buttonGroup.appendChild(readButton);
                    }
                    if (canWrite) {
                        const writeButton = document.createElement('button');
                        writeButton.className = 'write-btn';
                        writeButton.textContent = 'Write';
                        writeButton.addEventListener('click', () => toggleWriteSection(deviceId, characteristicUuid));
                        buttonGroup.appendChild(writeButton);
                    }
                    if (canNotify) {
                        const subscribeButton = document.createElement('button');
                        subscribeButton.className = 'subscribe-btn';
                        subscribeButton.id = generatedId('subscribe-btn', deviceId, characteristicUuid);
                        subscribeButton.textContent = 'Subscribe';
                        subscribeButton.addEventListener('click', () => toggleSubscription(deviceId, characteristicUuid));
                        buttonGroup.appendChild(subscribeButton);
                    }
                    if (!canRead && !canWrite && !canNotify) {
                        const noAccess = document.createElement('span');
                        noAccess.style.color = '#ccc';
                        noAccess.style.fontSize = '0.8rem';
                        noAccess.style.textAlign = 'center';
                        noAccess.textContent = 'No access';
                        buttonGroup.appendChild(noAccess);
                    }

                    item.append(info, buttonGroup);
                    characteristicsContainer.appendChild(item);
                    characteristicsContainer.append(
                        createValueContainer(deviceId, characteristicUuid),
                        createWriteSection(deviceId, characteristicUuid),
                        createNotificationsSection(deviceId, characteristicUuid)
                    );
                }
            } catch (error) {
                console.error('Error loading characteristics:', error);
                setMessage(characteristicsContainer, 'error', `Failed to load characteristics: ${error.message}`);
            }
        }

        function createValueContainer(deviceId, characteristicUuid) {
            const container = document.createElement('div');
            container.id = generatedId('value', deviceId, characteristicUuid);
            container.className = 'characteristic-value';
            container.style.display = 'none';
            return container;
        }

        function createWriteSection(deviceId, characteristicUuid) {
            const section = document.createElement('div');
            section.id = generatedId('write', deviceId, characteristicUuid);
            section.className = 'write-section';
            section.style.display = 'none';

            const label = document.createElement('label');
            label.setAttribute('for', generatedId('write-input', deviceId, characteristicUuid));
            label.textContent = 'Enter hex value to write:';

            const input = document.createElement('input');
            input.type = 'text';
            input.id = generatedId('write-input', deviceId, characteristicUuid);
            input.className = 'write-input';
            input.placeholder = 'e.g., 48656c6c6f (hex string)';
            input.pattern = '[0-9a-fA-F]*';
            input.title = 'Enter a valid hex string (0-9, a-f, A-F)';

            const actions = document.createElement('div');
            actions.style.marginTop = '8px';

            const send = document.createElement('button');
            send.className = 'write-btn';
            send.textContent = 'Send';
            send.addEventListener('click', () => writeCharacteristic(deviceId, characteristicUuid, send));

            const cancel = document.createElement('button');
            cancel.className = 'read-btn';
            cancel.textContent = 'Cancel';
            cancel.addEventListener('click', () => toggleWriteSection(deviceId, characteristicUuid));

            actions.append(send, cancel);

            const tip = document.createElement('div');
            tip.style.fontSize = '0.8rem';
            tip.style.color = '#666';
            tip.style.marginTop = '5px';
            tip.textContent = 'Tip: Enter data as hex string (e.g., "48656c6c6f" for "Hello")';

            section.append(label, input, actions, tip);
            return section;
        }

        function createNotificationsSection(deviceId, characteristicUuid) {
            const section = document.createElement('div');
            section.id = generatedId('notifications', deviceId, characteristicUuid);
            section.className = 'notifications-section';
            section.style.display = 'none';

            const heading = document.createElement('h4');
            heading.textContent = 'Live Notifications';
            const list = document.createElement('div');
            list.id = generatedId('notifications-list', deviceId, characteristicUuid);

            section.append(heading, list);
            return section;
        }

        async function readCharacteristic(deviceId, characteristicUuid, button) {
            const valueContainer = getValueContainer(deviceId, characteristicUuid);
            button.disabled = true;
            button.textContent = 'Reading...';

            try {
                const response = await fetch(`/ble/devices/${apiPart(deviceId)}/characteristics/${apiPart(characteristicUuid)}`);
                if (!response.ok) {
                    throw new Error(errorFromResponse(response, await parseErrorResponse(response)));
                }

                const data = await response.json();
                valueContainer.replaceChildren();
                appendLabeledLine(valueContainer, 'Value:', text(data.value, 'No data'));
                const lastRead = document.createElement('small');
                lastRead.textContent = `Last read: ${new Date().toLocaleTimeString()}`;
                valueContainer.appendChild(lastRead);
                valueContainer.style.display = 'block';
            } catch (error) {
                console.error('Error reading characteristic:', error);
                setMessage(valueContainer, 'error', `Failed to read: ${error.message}`);
                valueContainer.style.display = 'block';
            } finally {
                button.disabled = false;
                button.textContent = 'Read';
            }
        }

        function toggleWriteSection(deviceId, characteristicUuid) {
            const writeSection = getWriteSection(deviceId, characteristicUuid);
            const isVisible = writeSection.style.display === 'block';
            writeSection.style.display = isVisible ? 'none' : 'block';

            if (!isVisible) {
                const input = getWriteInput(deviceId, characteristicUuid);
                setTimeout(() => input.focus(), 100);
            }
        }

        async function writeCharacteristic(deviceId, characteristicUuid, button) {
            const input = getWriteInput(deviceId, characteristicUuid);
            const writeSection = getWriteSection(deviceId, characteristicUuid);
            const valueContainer = getValueContainer(deviceId, characteristicUuid);
            const hexValue = input.value.trim();

            if (!hexValue) {
                alert('Please enter a hex value to write.');
                return;
            }
            if (!/^[0-9a-fA-F]*$/.test(hexValue)) {
                alert('Invalid hex format. Please use only 0-9 and a-f characters.');
                return;
            }
            if (hexValue.length % 2 !== 0) {
                alert('Hex string must have an even number of characters.');
                return;
            }

            button.disabled = true;
            button.textContent = 'Writing...';

            try {
                const response = await fetch(`/ble/devices/${apiPart(deviceId)}/characteristics/${apiPart(characteristicUuid)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ value: hexValue, withoutResponse: false })
                });

                if (!response.ok) {
                    throw new Error(errorFromResponse(response, await parseErrorResponse(response)));
                }

                valueContainer.replaceChildren();
                const success = document.createElement('div');
                success.className = 'success';
                const title = document.createElement('strong');
                title.textContent = 'Write successful!';
                success.appendChild(title);
                success.appendChild(document.createElement('br'));
                appendText(success, `Value written: ${hexValue}`);
                success.appendChild(document.createElement('br'));
                const writtenAt = document.createElement('small');
                writtenAt.textContent = `Written at: ${new Date().toLocaleTimeString()}`;
                success.appendChild(writtenAt);
                valueContainer.appendChild(success);
                valueContainer.style.display = 'block';

                input.value = '';
                writeSection.style.display = 'none';
            } catch (error) {
                console.error('Error writing characteristic:', error);
                setMessage(valueContainer, 'error', `Failed to write: ${error.message}`);
                valueContainer.style.display = 'block';
            } finally {
                button.disabled = false;
                button.textContent = 'Send';
            }
        }

        async function toggleSubscription(deviceId, characteristicUuid) {
            const button = document.getElementById(generatedId('subscribe-btn', deviceId, characteristicUuid));
            const notificationsSection = document.getElementById(generatedId('notifications', deviceId, characteristicUuid));
            const subscriptionKey = `${deviceId}-${characteristicUuid}`;
            const isSubscribed = activeSubscriptions.has(subscriptionKey);

            button.disabled = true;
            button.textContent = isSubscribed ? 'Unsubscribing...' : 'Subscribing...';

            try {
                if (isSubscribed) {
                    const response = await fetch(`/ble/devices/${apiPart(deviceId)}/characteristics/${apiPart(characteristicUuid)}/unsubscribe`, { method: 'POST' });
                    if (!response.ok) {
                        throw new Error(errorFromResponse(response, await parseErrorResponse(response)));
                    }

                    const intervalId = pollingIntervals.get(subscriptionKey);
                    if (intervalId) {
                        clearInterval(intervalId);
                        pollingIntervals.delete(subscriptionKey);
                    }

                    activeSubscriptions.delete(subscriptionKey);
                    button.textContent = 'Subscribe';
                    button.classList.remove('subscribed');
                    notificationsSection.style.display = 'none';
                } else {
                    const response = await fetch(`/ble/devices/${apiPart(deviceId)}/characteristics/${apiPart(characteristicUuid)}/subscribe`, { method: 'POST' });
                    if (!response.ok) {
                        throw new Error(errorFromResponse(response, await parseErrorResponse(response)));
                    }

                    activeSubscriptions.set(subscriptionKey, {
                        deviceId,
                        characteristicUuid,
                        subscribedAt: new Date().toISOString(),
                        lastNotificationTime: 0
                    });

                    button.textContent = 'Unsubscribe';
                    button.classList.add('subscribed');
                    notificationsSection.style.display = 'block';
                    startNotificationPolling(deviceId, characteristicUuid);
                }
            } catch (error) {
                console.error('Subscription error:', error);
                const valueContainer = getValueContainer(deviceId, characteristicUuid);
                setMessage(valueContainer, 'error', `Subscription failed: ${error.message}`);
                valueContainer.style.display = 'block';

                setTimeout(() => {
                    if (valueContainer.textContent.includes('Subscription failed')) {
                        valueContainer.style.display = 'none';
                    }
                }, 5000);
            } finally {
                button.disabled = false;
            }
        }

        function startNotificationPolling(deviceId, characteristicUuid) {
            const subscriptionKey = `${deviceId}-${characteristicUuid}`;
            const subscription = activeSubscriptions.get(subscriptionKey);
            if (!subscription) return;

            const intervalId = setInterval(async () => {
                try {
                    const response = await fetch(`/ble/devices/${apiPart(deviceId)}/characteristics/${apiPart(characteristicUuid)}/notifications?since=${subscription.lastNotificationTime}&limit=50`);

                    if (!response.ok) {
                        if (response.status === 404) {
                            clearInterval(intervalId);
                            pollingIntervals.delete(subscriptionKey);
                            activeSubscriptions.delete(subscriptionKey);

                            const button = document.getElementById(generatedId('subscribe-btn', deviceId, characteristicUuid));
                            if (button) {
                                button.textContent = 'Subscribe';
                                button.classList.remove('subscribed');
                            }
                            return;
                        }
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const data = await response.json();
                    if (data.notifications && data.notifications.length > 0) {
                        displayNotifications(deviceId, characteristicUuid, data.notifications);
                        const lastNotification = data.notifications[data.notifications.length - 1];
                        subscription.lastNotificationTime = new Date(lastNotification.receivedAt).getTime();
                    }
                } catch (error) {
                    console.error('Error polling notifications:', error);
                }
            }, 1000);

            pollingIntervals.set(subscriptionKey, intervalId);
        }

        function displayNotifications(deviceId, characteristicUuid, notifications) {
            const notificationsList = document.getElementById(generatedId('notifications-list', deviceId, characteristicUuid));

            notifications.forEach(notification => {
                const notificationDiv = document.createElement('div');
                notificationDiv.className = 'notification-item';

                const timestamp = new Date(notification.receivedAt).toLocaleTimeString();
                const notificationType = notification.isNotification ? 'Notification' : 'Indication';

                const type = document.createElement('div');
                const strong = document.createElement('strong');
                strong.textContent = notificationType;
                type.appendChild(strong);

                const value = document.createElement('div');
                value.className = 'notification-value';
                value.textContent = text(notification.value, 'No data');

                const time = document.createElement('div');
                time.className = 'notification-time';
                time.textContent = timestamp;

                notificationDiv.append(type, value, time);
                notificationsList.insertBefore(notificationDiv, notificationsList.firstChild);

                while (notificationsList.children.length > 20) {
                    notificationsList.removeChild(notificationsList.lastChild);
                }
            });
        }

        function cleanupSubscriptionsForDevice(deviceId) {
            const keysToRemove = [];

            activeSubscriptions.forEach((subscription, key) => {
                if (subscription.deviceId === deviceId) {
                    keysToRemove.push(key);
                }
            });

            keysToRemove.forEach(key => {
                const intervalId = pollingIntervals.get(key);
                if (intervalId) {
                    clearInterval(intervalId);
                    pollingIntervals.delete(key);
                }
                activeSubscriptions.delete(key);
            });
        }
    </script>
</body>
